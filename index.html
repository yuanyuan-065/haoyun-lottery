<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#3a0505" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='32'%20fill='%23b3241a'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='24'%20fill='%23ffd166'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='7'%20fill='%23b3241a'/%3E%3C/svg%3E" />
<title>好运抽奖机 · 点一下试试手气</title>
<meta name="description" content="今天的好运是什么？点一下抽奖机就知道。" />
<meta property="og:title" content="好运抽奖机 · 点一下试试手气" />
<meta property="og:description" content="今天的好运是什么？点一下抽奖机就知道。" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #ffe9c4;
    background:
      radial-gradient(90% 60% at 50% -10%, #9a1b1b 0%, rgba(154, 27, 27, 0) 70%),
      radial-gradient(120% 90% at 50% 110%, #1f0202 0%, rgba(31, 2, 2, 0) 65%),
      linear-gradient(180deg, #651010 0%, #430909 50%, #250303 100%);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  :root {
    --wheel: min(78vw, 330px, 44vh);
    --gold: #ffd166;
  }

  .stage {
    height: 100vh;
    height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 14px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3.4vh, 28px);
    overflow: hidden;
  }

  /* ---------- 顶部文案 ---------- */
  .head { text-align: center; }
  .eyebrow {
    margin: 0 0 9px;
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(255, 214, 150, .78);
  }
  .head h1 {
    margin: 0;
    font-size: clamp(25px, 7vw, 34px);
    letter-spacing: 3px;
    font-weight: 900;
    background: linear-gradient(180deg, #fff7dd 20%, #ffce62 70%, #e09a20 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 rgba(120, 12, 12, .55));
  }
  .sub {
    margin: 9px 0 0;
    font-size: clamp(12px, 3.4vw, 14px);
    letter-spacing: .5px;
    color: rgba(255, 233, 196, .72);
  }

  /* ---------- 转盘 ---------- */
  .wheel-wrap {
    position: relative;
    width: var(--wheel);
    height: var(--wheel);
    flex: 0 0 auto;
  }

  .wheel {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: conic-gradient(
      from -22.5deg,
      #ffe9b8 0deg 45deg, #ffc93f 45deg 90deg,
      #ffe9b8 90deg 135deg, #ffc93f 135deg 180deg,
      #ffe9b8 180deg 225deg, #ffc93f 225deg 270deg,
      #ffe9b8 270deg 315deg, #ffc93f 315deg 360deg
    );
    box-shadow:
      inset 0 0 0 7px rgba(146, 24, 16, .26),
      inset 0 0 26px rgba(146, 24, 16, .16),
      0 0 0 7px #ffdf9a,
      0 0 0 11px #b1261a,
      0 16px 34px rgba(0, 0, 0, .38);
    transform: rotate(0deg);
    transition: transform 4.2s cubic-bezier(.16, .74, .12, 1);
    will-change: transform;
  }

  .label {
    position: absolute;
    inset: 0;
    padding-top: 12%;
    text-align: center;
    transform: rotate(var(--a));
  }
  .label span {
    display: inline-block;
    transform: rotate(calc(-1 * var(--a)));
    font-size: clamp(12px, 3.4vw, 15px);
    font-weight: 800;
    letter-spacing: 1px;
    color: #8a2412;
    white-space: nowrap;
  }

  .pointer {
    position: absolute;
    top: -13px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 34px;
    z-index: 6;
    background: linear-gradient(180deg, #fffbe8 0%, #ffc93f 70%, #e0931a 100%);
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    filter: drop-shadow(0 4px 5px rgba(0, 0, 0, .35));
  }

  .spin-btn {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 30%;
    max-width: 94px;
    min-width: 72px;
    aspect-ratio: 1 / 1;
    padding: 0;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #fffbe6 0%, #ffd166 42%, #eda32a 100%);
    box-shadow:
      0 0 0 4px #fff4cf,
      0 0 0 8px #a3241a,
      0 8px 20px rgba(0, 0, 0, .45);
    color: #8a1f13;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    z-index: 5;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .spin-btn b { font-size: clamp(16px, 4.4vw, 20px); line-height: 1.1; letter-spacing: 2px; }
  .spin-btn span { font-size: 11px; letter-spacing: 2px; opacity: .8; }
  .spin-btn:active { transform: translate(-50%, -50%) scale(.94); }
  .spin-btn[disabled] { animation: throb 1.1s ease-in-out infinite; }
  @keyframes throb {
    0%, 100% { box-shadow: 0 0 0 4px #fff4cf, 0 0 0 8px #a3241a, 0 8px 20px rgba(0, 0, 0, .45); }
    50% { box-shadow: 0 0 0 4px #fff4cf, 0 0 0 12px rgba(255, 209, 102, .35), 0 8px 26px rgba(255, 180, 60, .45); }
  }

  /* ---------- 底部 ---------- */
  .foot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
  }
  .share {
    border: 1px solid rgba(255, 209, 102, .35);
    background: rgba(255, 209, 102, .08);
    color: #ffd98f;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 8px 16px;
    border-radius: 999px;
  }
  .share:active { background: rgba(255, 209, 102, .2); }
  .foot .tip {
    margin: 0;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255, 233, 196, .48);
  }

  /* ---------- 中奖弹窗 ---------- */
  .result {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26px;
    background: radial-gradient(70% 55% at 50% 45%, rgba(90, 8, 8, .74), rgba(20, 2, 2, .9));
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s ease, visibility .35s;
  }
  .result.show { opacity: 1; visibility: visible; }
  .card {
    width: 100%;
    max-width: 340px;
    padding: 34px 24px 30px;
    border-radius: 22px;
    text-align: center;
    background: linear-gradient(165deg, #fffaea 0%, #ffecc0 55%, #ffdf9a 100%);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, .5),
      inset 0 0 0 2px #fff8e0,
      inset 0 0 0 3px #f0be5c;
    transform: scale(.82) translateY(10px);
    transition: transform .5s cubic-bezier(.2, 1.5, .4, 1);
  }
  .result.show .card { transform: scale(1) translateY(0); }
  .kicker {
    margin: 0 0 14px;
    font-size: 11px;
    letter-spacing: 5px;
    color: #b07725;
  }
  .card h2 {
    margin: 0;
    font-size: clamp(27px, 8vw, 34px);
    line-height: 1.32;
    letter-spacing: 2px;
    font-weight: 900;
    color: #b3241a;
    text-shadow: 0 2px 0 rgba(255, 255, 255, .65);
  }
  .loading {
    margin: 18px 0 0;
    font-size: 12.5px;
    letter-spacing: 1px;
    color: #a06a2b;
  }
  .dots {
    display: inline-flex;
    gap: 4px;
    margin-left: 5px;
    vertical-align: middle;
  }
  .dots i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #b3241a;
    opacity: .25;
    animation: dot 1s infinite;
  }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes dot {
    0%, 100% { opacity: .25; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }

  /* ---------- 视频层 ---------- */
  .video-layer {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #000;
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s ease, visibility .4s;
  }
  .video-layer.show { opacity: 1; visibility: visible; }
  .video-layer video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .close {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 12px);
    right: 14px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 64px;
    border: 0;
    padding: 0 18px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    color: #fff;
    background: rgba(255, 255, 255, .18);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .tap-play {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    border: 0;
    border-radius: 999px;
    padding: 14px 26px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #7a1a10;
    background: linear-gradient(180deg, #fff6d8, #ffcf5c);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
  .tap-play[hidden] { display: none; }

  /* ---------- 提示 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 44px);
    transform: translate(-50%, 8px);
    z-index: 50;
    padding: 9px 18px;
    border-radius: 999px;
    background: rgba(0, 0, 0, .74);
    color: #ffe9c4;
    font-size: 12.5px;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-height: 620px) {
    :root { --wheel: min(72vw, 270px, 40vh); }
    .sub { display: none; }
    .stage { gap: 12px; }
  }
</style>
</head>
<body>

<main class="stage">
  <header class="head">
    <p class="eyebrow">今日好运测试</p>
    <h1>好运抽奖机</h1>
    <p class="sub">点一下中间的按钮，看看今天的好运</p>
  </header>

  <section class="wheel-wrap">
    <div class="pointer"></div>
    <div class="wheel" id="wheel">
      <div class="label" style="--a:0deg"><span>好运</span></div>
      <div class="label" style="--a:45deg"><span>暴富</span></div>
      <div class="label" style="--a:90deg"><span>脱单</span></div>
      <div class="label" style="--a:135deg"><span>加薪</span></div>
      <div class="label" style="--a:180deg"><span>上岸</span></div>
      <div class="label" style="--a:225deg"><span>瘦十斤</span></div>
      <div class="label" style="--a:270deg"><span>健康</span></div>
      <div class="label" style="--a:315deg"><span>中奖</span></div>
    </div>
    <button class="spin-btn" id="spinBtn" type="button">
      <b>开始</b><span>抽奖</span>
    </button>
  </section>

  <footer class="foot">
    <button class="share" id="shareBtn" type="button">复制链接，发给朋友一起测</button>
    <p class="tip">仅供娱乐 · 好运是真的</p>
  </footer>
</main>

<div class="result" id="result" role="dialog" aria-modal="true" aria-label="抽奖结果">
  <div class="card">
    <p class="kicker">今日手气 · 上上签</p>
    <h2>恭喜你<br>抽到了好运</h2>
    <p class="loading">好运视频正在赶来<span class="dots"><i></i><i></i><i></i></span></p>
  </div>
</div>

<div class="video-layer" id="videoLayer">
  <video id="player"
         src="never-gonna-give-you-up.mp4"
         preload="metadata"
         playsinline
         webkit-playsinline
         x5-playsinline
         controls></video>
  <button class="tap-play" id="tapPlay" type="button" hidden>点击播放视频</button>
  <button class="close" id="closeBtn" type="button">关闭</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var wheel     = document.getElementById('wheel');
  var spinBtn   = document.getElementById('spinBtn');
  var result    = document.getElementById('result');
  var videoLayer= document.getElementById('videoLayer');
  var player    = document.getElementById('player');
  var tapPlay   = document.getElementById('tapPlay');
  var closeBtn  = document.getElementById('closeBtn');
  var shareBtn  = document.getElementById('shareBtn');
  var toastEl   = document.getElementById('toast');

  var SEG_COUNT = 8;              // 与页面上 8 个扇区一致
  var TARGET    = 0;              // 每次停在「好运」扇区
  var SEG_ANGLE = 360 / SEG_COUNT;

  var rotation  = 0;
  var spinning  = false;
  var resultTimer = null;
  var playTimer   = null;
  var spinTimer   = null;

  /* 第一次点击时顺手解锁音频/视频（iOS、微信的自动播放限制） */
  var audioCtx = null;
  function unlockMedia() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        gain.gain.value = 0.0001;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      }
    } catch (e) {}

    try {
      player.muted = true;
      var p = player.play();
      if (p && typeof p.then === 'function') {
        p.then(function () {
          player.pause();
          player.currentTime = 0;
        }).catch(function () {});
      }
    } catch (e) {}
  }

  function startSpin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;

    unlockMedia();
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }

    // 停在「好运」扇区中间（该扇区中心正对 0°，与顶部指针对齐），留一点随机偏移
    var jitter = (Math.random() - 0.5) * 16;
    var targetCenter = TARGET * SEG_ANGLE;
    var targetMod = ((-targetCenter + jitter) % 360 + 360) % 360;
    var currentMod = ((rotation % 360) + 360) % 360;
    var delta = ((targetMod - currentMod) % 360 + 360) % 360;
    var turns = 5 + Math.floor(Math.random() * 3);

    rotation += turns * 360 + delta;
    wheel.style.transform = 'rotate(' + rotation + 'deg)';

    spinTimer = window.setTimeout(finishSpin, 4600); // transitionend 兜底
  }

  function finishSpin() {
    if (!spinning) return;
    spinning = false;
    window.clearTimeout(spinTimer);

    resultTimer = window.setTimeout(function () {
      result.classList.add('show');
      if (navigator.vibrate) { try { navigator.vibrate([20, 60, 30]); } catch (e) {} }
      playTimer = window.setTimeout(showVideo, 3000);
    }, 260);
  }

  function showVideo() {
    result.classList.remove('show');
    videoLayer.classList.add('show');
    tapPlay.hidden = true;

    try {
      player.currentTime = 0;
      player.muted = false;
      player.volume = 1;
    } catch (e) {}

    var p = player.play();
    if (p && typeof p.then === 'function') {
      p.catch(function () {
        tapPlay.hidden = false; // 被浏览器拦了，给个手动按钮
      });
    }
  }

  function resetGame() {
    videoLayer.classList.remove('show');
    result.classList.remove('show');
    try { player.pause(); player.currentTime = 0; } catch (e) {}
    window.clearTimeout(playTimer);
    window.clearTimeout(resultTimer);
    spinning = false;
    spinBtn.disabled = false;
    tapPlay.hidden = true;
  }

  wheel.addEventListener('transitionend', function (e) {
    if (e.propertyName === 'transform') finishSpin();
  });

  spinBtn.addEventListener('click', startSpin);

  closeBtn.addEventListener('click', resetGame);

  tapPlay.addEventListener('click', function () {
    tapPlay.hidden = true;
    var p = player.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function () { tapPlay.hidden = false; });
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && videoLayer.classList.contains('show')) {
      try { player.pause(); } catch (e) {}
    }
  });

  /* 复制链接 */
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    window.clearTimeout(toast._t);
    toast._t = window.setTimeout(function () {
      toastEl.classList.remove('show');
    }, 1800);
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  shareBtn.addEventListener('click', function () {
    var url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        toast('链接已复制，发给朋友吧');
      }).catch(function () {
        toast(legacyCopy(url) ? '链接已复制，发给朋友吧' : '复制失败，请手动分享');
      });
    } else {
      toast(legacyCopy(url) ? '链接已复制，发给朋友吧' : '复制失败，请手动分享');
    }
  });
})();
</script>
</body>
</html>
